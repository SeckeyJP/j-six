# J-SIX 品質ゲート — 外側ループ（CI）
#
# 内側ループ（ローカルの Stop hook）と**同じ判定スクリプト・同じ設定ファイル**を使う。
# ローカルで緑になったものが CI で赤になる（またはその逆）ことを避けるため。
#
# なぜ二重化するのか:
#   1. Stop hook は8回連続ブロックすると Claude Code が上書きしてターンを終了する
#   2. Hook の有効化は各開発者のローカル設定に依存する
#   3. J-SIX Plugin は .jsix-checks.json が無ければ何もしない（オプトイン）
# つまり Hook は最終防衛線にならない。解除されても CI で止まる構成にする。
#
# 対象はサンプルアプリ2本（examples/approval-workflow/ と examples/monthly-billing/）で、
# matrix で同じ手順を回す。2本は .jsix-checks.json と Makefile の構成が同じなので、
# ゲートの手順を分岐させずに済む。
#
# ワークフロー自体は**リポジトリ直下**に置く必要がある（GitHub Actions はサブディレクトリの
# .github/workflows/ を読まない）。自プロジェクトへ持ち込む際も直下に置き、
# matrix を外して working-directory と paths を対象に合わせて書き換える。

name: J-SIX Quality Gate

on:
  pull_request:
    paths:
      - "examples/approval-workflow/**"
      - "examples/monthly-billing/**"
      - "plugin/scripts/**"
      - ".github/workflows/jsix-gate.yml"
  push:
    branches: [main]
    paths:
      - "examples/approval-workflow/**"
      - "examples/monthly-billing/**"
      - "plugin/scripts/**"
      - ".github/workflows/jsix-gate.yml"

# SARIF を GitHub の Code scanning に上げるために必要
permissions:
  contents: read
  security-events: write

jobs:
  # Plugin のチェックスクリプト自体の単体テスト。
  # ゲートを実行する道具が壊れていないことを先に確かめる。
  plugin-scripts:
    name: plugin/scripts 単体テスト
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: python -m pip install -q pytest
      - run: python -m pytest plugin/scripts/tests -q

  gate:
    name: G1 → G2 → G4（${{ matrix.example }}）
    needs: plugin-scripts
    runs-on: ubuntu-latest
    strategy:
      # 片方のサンプルが落ちても、もう片方の結果（と証跡）は最後まで出す
      fail-fast: false
      matrix:
        example: [approval-workflow, monthly-billing]
    defaults:
      run:
        working-directory: examples/${{ matrix.example }}
    steps:
      - uses: actions/checkout@v7
        with:
          # G2 のテスト改変検出が RED タグと比較するため、履歴とタグが必要
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      # ランナーの Python は 3.11 なので、mutation testing も同じ venv で動かせる
      # （ローカルが 3.9 の場合だけ .venv-mut を分ける。Makefile が自動で選ぶ）
      - name: 依存インストール
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -q -r requirements.txt -r requirements-dev.txt mutmut

      # --- G1 の成果物のうち、外部ツールが要るものを CI で生成する -------------
      - name: レポート出力先を用意
        run: mkdir -p reports

      # plugin は SARIF を読むだけで、どのツールを使うかはプロジェクトが決める。
      # ここでは trivy で secret と 依存脆弱性 の2種を出す（gitleaks 等でもよい）。
      # continue-on-error なのは、検出の有無ではなく **閾値判定を plugin 側に寄せる**ため。
      - name: secret スキャン（SARIF 生成）
        uses: aquasecurity/trivy-action@v0.36.0
        continue-on-error: true
        with:
          scan-type: fs
          scan-ref: examples/${{ matrix.example }}
          scanners: secret
          format: sarif
          output: examples/${{ matrix.example }}/reports/secrets.sarif

      - name: 依存脆弱性スキャン（SARIF 生成）
        uses: aquasecurity/trivy-action@v0.36.0
        continue-on-error: true
        with:
          scan-type: fs
          scan-ref: examples/${{ matrix.example }}
          scanners: vuln
          format: sarif
          output: examples/${{ matrix.example }}/reports/deps.sarif

      # --- ゲート本体 -----------------------------------------------------------
      # --run-commands を付けるのは CI だけ。ローカルの Stop hook は既存の成果物を
      # 読むだけで、build や test を毎ターン走らせない（Hook が無効化される運用を避ける）。
      #
      # G3（LLM judge）は CI では必須にしない。CI で LLM の API キーを扱わずに済ませ、
      # 判定は PR 上の /code-review とレビュアーに委ねる。
      - name: J-SIX 品質ゲート（G1 → G2 → G4）
        run: |
          python3 ../../plugin/scripts/jsix_run_checks.py \
            --run-commands \
            --gates g1,g2,g4 \
            --json reports/gate.json

      # --- 証跡を残す ------------------------------------------------------------
      - name: 証跡パッケージを生成
        if: always()
        run: |
          python3 ../../plugin/scripts/jsix_evidence_pack.py \
            --results reports/gate.json --out reports/evidence/ || true

      - name: 証跡をアーティファクトとして保存
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jsix-evidence-${{ matrix.example }}-${{ github.sha }}
          path: examples/${{ matrix.example }}/reports/
          retention-days: 90

      # Code scanning への登録は private リポジトリでは Advanced Security が要るため、
      # 失敗してもゲートの判定には影響させない。
      - name: SARIF を Code scanning に登録
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        continue-on-error: true
        with:
          sarif_file: examples/${{ matrix.example }}/reports/
          # matrix の2本が同じ commit に上げるため、カテゴリで区別する
          category: jsix-${{ matrix.example }}
