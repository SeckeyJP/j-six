<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>{% block title %}月次請求書発行{% endblock %}</title>
<style>
 body{font-family:system-ui,"Hiragino Sans","Noto Sans JP",sans-serif;margin:24px;color:#1a1a1a}
 table{border-collapse:collapse;width:100%;margin:12px 0}
 th,td{border:1px solid #ccc;padding:6px 10px;font-size:14px}
 th{background:#f4f4f5;text-align:left}
 td.num{text-align:right;font-variant-numeric:tabular-nums}
 .status-DRAFT{color:#92400e}
 .status-CONFIRMED{color:#065f46;font-weight:600}
 .reduced{color:#b45309}
 nav a{margin-right:12px}
</style>
</head>
<body>
{% block body %}{% endblock %}
</body>
</html>
